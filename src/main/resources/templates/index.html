<!DOCTYPE html>
<html lang="sr" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Moji recepti</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container">

  <div class="zaglavlje">
    <p>
      Prijavljeni korisnik:
      <strong th:text="${korisnik.korisnickoIme}"></strong>
    </p>

    <a href="/odjava" class="dugme">Odjava</a>
  </div>

  <h1>Moji recepti</h1>

  <!-- Pretraga -->
  <form action="/pretraga" method="get" class="pretraga">

    <input type="text"
           name="naziv"
           th:value="${nazivPretrage}"
           placeholder="Unesite naziv recepta">

    <button type="submit">Pretrazi</button>

  </form>

  <!-- Glavne akcije -->
  <div class="akcije">

    <a href="/novi" class="dugme">
      + Dodaj novi recept
    </a>

    <a href="/" class="dugme">
      Prikazi sve
    </a>

  </div>

  <!-- Recepti -->
  <table>

    <thead>
    <tr>
      <th>Naziv</th>
      <th>Kategorija</th>
      <th>Sastojci</th>
      <th>Priprema</th>
      <th>Akcije</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="recept : ${recepti}">

      <td th:text="${recept.naziv}"></td>
      <td th:text="${recept.kategorija}"></td>
      <td th:text="${recept.sastojci}"></td>
      <td th:text="${recept.priprema}"></td>

      <td>
        <a th:href="@{/izmeni/{id}(id=${recept.id})}">
          Izmeni
        </a>

        <a th:href="@{/obrisi/{id}(id=${recept.id})}"
           onclick="return confirm('Da li sigurno zelite da obrisete recept?');">
          Obrisi
        </a>
      </td>

    </tr>

    </tbody>

  </table>

  <p th:if="${#lists.isEmpty(recepti)}">
    Nema pronadjenih recepata.
  </p>

</div>

</body>
</html>
