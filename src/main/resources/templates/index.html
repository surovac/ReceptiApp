<!DOCTYPE html>
<html lang="sr" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Moji recepti</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div style="
    width: 100%;
    padding-top: 150px;
    display: flex;
    flex-direction: column;
    align-items: center;
">

  <h1 style="
        margin: 0 0 30px 0;
        font-family: Arial, sans-serif;
        font-size: 36px;
    ">
    Moji recepti
  </h1>

  <form action="/pretraga"
        method="get"
        style="
              width: 600px;
              display: flex;
              flex-direction: column;
              align-items: center;
          ">

    <input type="text"
           name="naziv"
           placeholder="Pretraži recepte..."
           required
           style="
                   width: 600px;
                   height: 48px;
                   padding: 0 20px;
                   border: 1px solid #bbb;
                   border-radius: 24px;
                   font-size: 15px;
                   outline: none;
                   box-sizing: border-box;
               ">

    <button type="submit"
            style="
                    margin-top: 20px;
                    padding: 10px 20px;
                    background: #333;
                    color: white;
                    border: none;
                    border-radius: 4px;
                    font-size: 14px;
                    cursor: pointer;
                ">
      Pretraži
    </button>

  </form>

  <div style="
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 12px;
    ">

    <a href="/novi"
       style="
               padding: 10px 20px;
               background: #333;
               color: white;
               text-decoration: none;
               border-radius: 4px;
               font-family: Arial, sans-serif;
               font-size: 14px;
           ">
      + Novi recept
    </a>

    <a href="/recepti"
       style="
               padding: 10px 20px;
               background: #333;
               color: white;
               text-decoration: none;
               border-radius: 4px;
               font-family: Arial, sans-serif;
               font-size: 14px;
           ">
      Prikaži sve
    </a>

  </div>

</div>

</body>
</html>
